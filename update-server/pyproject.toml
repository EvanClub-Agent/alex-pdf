[project]
name = "alexpdf-update-server"
version = "0.1.0"
description = "AlexPDF 更新服务 — FastAPI + PostgreSQL，支持 HTTP Range 断点续传"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.163.2",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "python-multipart==0.0.34",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.2.2",
]

[tool.uv]
package = false
