<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>AlexPDF · API 文档</title>
    <link
      rel="stylesheet"
      integrity="sha384-WlYgdmXYOOBWL5apwjDEZwN+U3HmXSSu5R6V5aGxEcf7z+KuRNwBhoxKVN1i3D5I"
      crossorigin="anonymous"
      href="https://unpkg.com/swagger-ui-dist@5.35.0/swagger-ui.css"

      body { margin: 0; }

    </style>
  </head>

    <div id="swagger"></div>
    <script integrity="sha384-gjRm0bEPMeTmMh5jT2cHccIwCUZSTd8YC+j0d0sXw0MdGEfScduGpSyF3ZSSLkX9" crossorigin="anonymous" src="https://unpkg.com/swagger-ui-dist@5.35.0/swagger-ui-bundle.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: '/api/openapi.json',
        validatorUrl: null,
        dom_id: '#swagger',
        presets: [SwaggerUIBundle.presets.apis],
        layout: 'BaseLayout',
        deepLinking: true,
      });
    </script>
  </body>
</html>
