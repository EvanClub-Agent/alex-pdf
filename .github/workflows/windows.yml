name: Windows build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles nsis -- --locked
      - name: Verify Windows installer
        shell: pwsh
        run: ./.github/scripts/verify-installer.ps1
      - name: Keep installer for release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: AlexPDF-Windows-x64
          path: ${{ runner.temp }}/AlexPDF-Windows-x64-setup.exe
          if-no-files-found: error
