<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">AlexPDF · Word 和 Excel 本地转 PDF</title>
  <desc id="desc">Windows 桌面转换工具，以本机 WPS Office 或 Microsoft Office 将 DOC、DOCX、XLS、XLSX 文件导出为 PDF。</desc>
